      width: 100%; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.6);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.06); border-radius: 1rem;
      padding: 0.875rem 1.5rem; font-size: 0.875rem; margin-bottom: 1rem;
      outline: none; font-weight: 600; color: #1e293b; transition: all 0.3s;
    }
    .register-screen input:focus { box-shadow: 0 0 0 2px rgba(178,51,255,0.4); }
    .register-btn {
      width: 100%; background: linear-gradient(to right, #b233ff, #ff4df8); color: white;
      padding: 0.875rem 1.5rem; border-radius: 1rem; font-weight: 900; font-size: 0.625rem;
      text-transform: uppercase; letter-spacing: 0.2em; border: none; cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(178,51,255,0.4); transition: all 0.3s;
    }
    .register-btn:hover { box-shadow: 0 15px 25px -5px rgba(178,51,255,0.6); }

    /* Unread badge */
    .unread-badge {
      position: absolute; top: 0.5rem; right: 0.5rem;
      background: #f43f5e; color: white; width: 1.25rem; height: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 9999px; border: 2px solid white;
      animation: bounce 1s infinite; z-index: 50; font-size: 9px;
    }

    /* Menú opciones */
    .menu-option {
      position: relative; width: 100%; background: white; border: 2px solid #f1f5f9;
      border-radius: 1rem; padding: 1rem; display: flex; align-items: center; gap: 1rem;
      cursor: pointer; transition: all 0.3s; overflow: hidden; text-align: left;
    }
    .menu-option:hover { transform: translateY(-4px); }
    .menu-option-icon { width: 3rem; height: 3rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.3s; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .menu-option:hover .menu-option-icon { transform: scale(1.1); }
    .menu-option-chevron { position: absolute; right: 1.25rem; color: #cbd5e1; font-size: 0.875rem; transition: color 0.3s; }

    /* =========================================================
       CSS DE FACTIBILIDAD
       ========================================================= */
    :root {
      --primary: #d12fd3;
      --primary-gradient: linear-gradient(135deg, #b537f2 0%, #f02aa6 100%);
      --primary-glow: rgba(209,47,211,0.2);
      --success: #00f298;
      --success-bg: rgba(0,242,152,0.1);
      --warning: #ffb800;
      --warning-bg: rgba(255,184,0,0.1);
      --error: #ff4b81;
      --error-bg: rgba(255,75,129,0.1);
      --bg: #07050a;
      --surface: #120f1d;
      --surface-2: #1a1629;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(210,47,211,0.3);
      --text: #ffffff;
      --text-2: #a19eb1;
      --text-3: #5f5b77;
    }

    /* Modal overlay */
    #fw-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(7,5,10,0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center;
      z-index: 9998; opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #fw-modal-overlay.active { display: flex; opacity: 1; pointer-events: auto; }

    #fw-close-btn {
      position: absolute; top: 25px; right: 25px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--border);
      color: #fff; width: 45px; height: 45px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.3s ease; z-index: 10000;
    }
    #fw-close-btn:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg) scale(1.1); }

    .fw-app-container {
      position: relative; background: var(--surface);
      width: 92%; max-width: 480px; max-height: 90vh;
      padding: 35px; border: 1px solid var(--border);
      border-radius: 28px; box-shadow: 0 32px 80px rgba(0,0,0,0.8);
      overflow-y: auto; color: var(--text); font-family: 'DM Sans', sans-serif;
      animation: fwPopIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
    }
    @keyframes fwPopIn { from { transform: translateY(30px); } to { transform: translateY(0); } }
    .fw-app-container::-webkit-scrollbar { width: 6px; }
    .fw-app-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .fw-app-container header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .fw-logo { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--text); }
    .fw-logo em { font-style: normal; color: var(--primary); font-weight: 800; filter: drop-shadow(0 0 8px var(--primary-glow)); }
    .fw-badge { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-size: 0.62rem; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-2); text-transform: uppercase; }
    .fw-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); animation: fwPulse 2.5s infinite; }
    @keyframes fwPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.85)} }

    .fw-app-container h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 10px; color: #fff; line-height: 1.2; }
    .fw-subtitle { font-size: 0.9rem; color: var(--text-2); line-height: 1.5; margin-bottom: 25px; }

    .fw-tabs-container { display: flex; gap: 10px; margin-bottom: 25px; }
    .fw-tab-btn { flex: 1; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; color: var(--text-2); font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .fw-tab-btn.active { background: var(--primary-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(209,47,211,0.2); }
    .fw-tab-btn:hover:not(.active) { border-color: var(--border-hover); color: #fff; background: rgba(255,255,255,0.05); }

    /* ── CAMPOS SEPARADOS: estilos nuevos ────────────────── */
    .fw-fields-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fw-fields-row {
      display: flex;
      gap: 10px;
    }
    .fw-field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }
    .fw-field-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-left: 4px;
    }
    .fw-field-required {
      color: var(--primary);
      margin-left: 2px;
    }
    .fw-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .fw-field-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      flex-shrink: 0;
    }
    .fw-field-input {
      width: 100%;
      padding: 14px 14px 14px 40px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      transition: all 0.3s ease;
    }
    .fw-field-input::placeholder { color: var(--text-3); }
    .fw-field-input:focus {
      border-color: var(--primary);
      background: #1d1930;
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .fw-field-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 2px rgba(255,75,129,0.15);
    }
    .fw-field-input.ok {
      border-color: rgba(0,242,152,0.35);
    }
    /* Select igual al input */
    .fw-field-select {
      width: 100%;
      padding: 14px 14px 14px 40px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      transition: all 0.3s ease;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .fw-field-select:focus {
      border-color: var(--primary);
      background: #1d1930;
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .fw-field-select option {
      background: #1a1629;
      color: white;
    }
    /* Chevron del select */
    .fw-select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-3);
    }
    /* Preview de dirección armada */
    .fw-dir-preview {
      background: rgba(209,47,211,0.06);
      border: 1px solid rgba(209,47,211,0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      transition: all 0.3s;
    }
    .fw-dir-preview .preview-label {
      color: var(--text-3);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .fw-dir-preview .preview-value {
      color: #d1a6ff;
      font-weight: 500;
    }
    /* Tooltip de error */
    .fw-field-error-msg {
      font-size: 0.7rem;
      color: var(--error);
      padding-left: 4px;
      animation: fwFadeIn 0.2s ease;
    }

    /* ── FIN campos separados ────────────────────────────── */

    .fw-input-row { display: flex; flex-direction: column; gap: 15px; }
    .fw-input-wrap { position: relative; }
    .fw-input-wrap svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .fw-app-container input[type="text"] { width: 100%; padding: 18px 20px 18px 52px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--text); outline: none; transition: all 0.3s ease; }
    .fw-app-container input[type="text"]::placeholder { color: var(--text-3); }
    .fw-app-container input[type="text"]:focus { border-color: var(--primary); background: #1d1930; box-shadow: 0 0 0 3px var(--primary-glow); }

    .fw-main-btn { width: 100%; height: 56px; background: var(--primary-gradient); color: #fff; border: none; border-radius: 18px; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; box-shadow: 0 10px 20px rgba(181,55,242,0.2); }
    .fw-main-btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 15px 30px rgba(240,42,166,0.3); }
    .fw-main-btn:disabled { background: var(--surface-2); color: var(--text-3); box-shadow: none; transform: none; cursor: not-allowed; }

    .fw-clearBtn { width: 100%; height: 48px; background: transparent; color: var(--text-2); border: 1px solid var(--border); border-radius: 18px; font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; transition: all 0.2s; }
    .fw-clearBtn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: var(--text-3); }
    .fw-clearBtn.active { display: flex; animation: fwFadeIn 0.3s ease; }

    .fw-log-section { margin-top: 30px; display: none; animation: fwFadeIn 0.4s ease; }
    .fw-log-section.active { display: block; }
    .fw-log-label { font-size: 0.75rem; font-weight: 600; color: var(--text-2); margin-bottom: 15px; display: flex; justify-content: space-between; }

    .fw-progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 20px; position: relative; }
    .fw-progress-bar { height: 100%; width: 40%; background: var(--primary-gradient); border-radius: 10px; box-shadow: 0 0 15px var(--primary-glow); animation: fwProgressMove 1.8s infinite cubic-bezier(0.445,0.05,0.55,0.95); position: absolute; }
    @keyframes fwProgressMove { 0%{left:-40%} 100%{left:100%} }

    .fw-status-feed { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; padding: 18px; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    .fw-status-feed::-webkit-scrollbar { width: 4px; }
    .fw-status-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .fw-status-item { font-size: 0.88rem; line-height: 1.4; color: var(--text-2); display: flex; align-items: flex-start; gap: 10px; animation: fwItemSlide 0.3s ease forwards; }
    .fw-status-item i { margin-top: 4px; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--primary); box-shadow: 0 0 5px var(--primary-glow); display: block; }
    .fw-status-item.ok   { color: var(--success); } .fw-status-item.ok   i { background: var(--success); box-shadow: 0 0 5px var(--success); }
    .fw-status-item.warn { color: var(--warning); } .fw-status-item.warn i { background: var(--warning); box-shadow: 0 0 5px var(--warning); }
    .fw-status-item.err  { color: var(--error);   } .fw-status-item.err  i { background: var(--error);   box-shadow: 0 0 5px var(--error); }

    .fw-result-section { margin-top: 25px; display: none; }
    .fw-result-section.active { display: block; }
    .fw-result-card { border-radius: 24px; padding: 24px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); }
    .fw-result-card.success { background: var(--success-bg); border-color: rgba(0,242,152,0.15); }
    .fw-result-card.warning { background: var(--warning-bg); border-color: rgba(255,184,0,0.15); }
    .fw-result-card.error   { background: var(--error-bg);   border-color: rgba(255,75,129,0.15); }
    .fw-result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .fw-result-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; }
    .fw-result-body { font-size: 0.9rem; line-height: 1.5; color: var(--text-2); white-space: pre-line; }
    .fw-result-img { margin-top: 15px; width: 100%; border-radius: 16px; border: 1px solid var(--border); display: none; }
    .fw-result-img.visible { display: block; }

    .fw-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: fwSpin 0.7s linear infinite; }
    @keyframes fwSpin { to { transform: rotate(360deg); } }

    @keyframes fwItemSlide { from{opacity:0;transform:translateX(-5px)} to{opacity:1;transform:translateX(0)} }
    @keyframes fwFadeIn    { from{opacity:0} to{opacity:1} }

    .fw-footer { margin-top: 30px; display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 20px; }
    .fw-footer span { font-size: 0.68rem; color: var(--text-3); font-weight: 600; letter-spacing: 0.5px; }

    /* Custom Prompt */
    #customPromptOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 10005;
      justify-content: center; align-items: center;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    #customPromptOverlay.active { display: flex; }
    .custom-prompt-box {
      background: var(--surface); padding: 30px; border-radius: 20px;
      border: 1px solid var(--primary); text-align: center;
      width: 85%; max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: fwPopIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      color: white; font-family: 'DM Sans', sans-serif;
    }
    .custom-prompt-box h3 { margin-bottom: 10px; font-family: 'Syne', sans-serif; font-size: 1rem; }
    .custom-prompt-box p  { font-size: 0.85rem; color: var(--text-2); margin-bottom: 20px; }
    .custom-prompt-box input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: white; outline: none;
      text-align: center; font-size: 0.95rem; transition: border-color 0.3s;
    }
    .custom-prompt-box input:focus { border-color: var(--primary); }
    .custom-prompt-box .fw-main-btn { height: 46px; border-radius: 12px; font-size: 0.9rem; }

    @media (max-width: 480px) {
      .fw-app-container {
        width: 100%; height: 100vh; max-height: none;
        border-radius: 0; border: none; padding: 25px;
      }
      #fw-close-btn { top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: none; }
      .fw-fields-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="fw-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ── Configuración ─────────────────────────────────────── */
    const SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbyFQrjcC_LLuDTzdvh_ERtODENeSiwv1N0ATBnq7Qenkb3SK8eHlMWkLcMaZligaluxIw/exec";
    const SERVER_BASE = "https://botintegrar-production.up.railway.app";

    /* ── Regiones de Chile ─────────────────────────────────── */
    const REGIONES_CHILE = [
      { value: "", label: "Región" },
      { value: "arica-parinacota",  label: "Arica y Parinacota" },
      { value: "tarapaca",          label: "Tarapacá" },
      { value: "antofagasta",       label: "Antofagasta" },
      { value: "atacama",           label: "Atacama" },
      { value: "coquimbo",          label: "Coquimbo" },
      { value: "valparaiso",        label: "Valparaíso" },
      { value: "metropolitana",     label: "Metropolitana" },
      { value: "ohiggins",          label: "O'Higgins" },
      { value: "maule",             label: "Maule" },
      { value: "nuble",             label: "Ñuble" },
      { value: "biobio",            label: "Biobío" },
      { value: "araucania",         label: "Araucanía" },
      { value: "rios",              label: "Los Ríos" },
      { value: "lagos",             label: "Los Lagos" },
      { value: "aysen",             label: "Aysén" },
      { value: "magallanes",        label: "Magallanes" },
    ];

    /* ── API helper ────────────────────────────────────────── */
    const api = {
      get: async (action) => {
        try {
          const r = await fetch(`${SCRIPT_URL}?action=${action}`);
          return await r.json();
        } catch(e) { console.error(`Error GET ${action}:`, e); return []; }
      },
      post: async (action, data) => {
        try {
          const r = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action, data }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
          });
          return await r.json();
        } catch(e) { console.error(`Error POST ${action}:`, e); return { success: false }; }
      }
    };

    /* ================================================================
       WIDGET DEL CLIENTE
    ================================================================ */
    function ClientWebsite({ allMessages, cannedResponses }) {

      /* ── Chat / menú ─────────────────────────────────────── */
      const [isOpen,     setIsOpen]     = useState(false);
      const [showMenu,   setShowMenu]   = useState(false);
      const [newMessage, setNewMessage] = useState("");
      const [showEmojis, setShowEmojis] = useState(false);
      const emojis = ["😀","😂","😊","🥰","😎","🤔","👍","👎","🔥","✨","🎉","🚀","✅","❌","👀","⚡","📡","🔧","🏢","📝"];

      /* ── Factibilidad ────────────────────────────────────── */
      const [showFactibilidadModal,  setShowFactibilidadModal]  = useState(false);
      const [factMode,               setFactMode]               = useState("direccion");

      /* ── Campos separados para dirección ─────────────────── */
      const [campoCalle,   setCampoCalle]   = useState("");
      const [campoNumero,  setCampoNumero]  = useState("");
      const [campoComuna,  setCampoComuna]  = useState("");
      const [campoRegion,  setCampoRegion]  = useState("");
      const [campoDepto,   setCampoDepto]   = useState("");
      const [campoErrors,  setCampoErrors]  = useState({});

      const [rutInput,               setRutInput]               = useState("");
      const [isLoadingFact,          setIsLoadingFact]          = useState(false);
      const [factLogs,               setFactLogs]               = useState([]);
      const [factResult,             setFactResult]             = useState(null);
      const [searchBtnDisabled,      setSearchBtnDisabled]      = useState(false);
      const [rutBtnDisabled,         setRutBtnDisabled]         = useState(false);
      const [showCustomPrompt,       setShowCustomPrompt]       = useState(false);

      const [currentUserId, setCurrentUserId] = useState(() => localStorage.getItem("freework_user_id") || "No definido");
      const [editandoId, setEditandoId] = useState(false);
      const [nuevoIdTemp, setNuevoIdTemp] = useState("");

      const [customPromptInput,      setCustomPromptInput]      = useState("");
      const pendingActionRef = useRef(null);
      const logStreamRef     = useRef(null);

      /* ── Dirección preview ───────────────────────────────── */
      const dirPreview = useMemo(() => {
        const parts = [];
        if (campoCalle)  parts.push(campoCalle.trim());
        if (campoNumero) parts.push(campoNumero.trim());
        if (campoDepto)  parts.push(`Depto ${campoDepto.trim()}`);
        if (campoComuna) parts.push(campoComuna.trim());
        if (campoRegion) {
          const reg = REGIONES_CHILE.find(r => r.value === campoRegion);
          if (reg && reg.value) parts.push(reg.label);
        }
        return parts.join(", ");
      }, [campoCalle, campoNumero, campoDepto, campoComuna, campoRegion]);

      /* Auto-scroll logs */
      useEffect(() => {
        if (logStreamRef.current) logStreamRef.current.scrollTop = logStreamRef.current.scrollHeight;
      }, [factLogs]);

      /* ── Arrastre ────────────────────────────────────────── */
      const [pos,        setPos]        = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const widgetRef = useRef(null);
      const dragRef   = useRef({ startX:0, startY:0, initialRight:0, initialBottom:0, isDragMove:false });

      const handleDragStart = (e) => {
        if (e.type.includes("mouse") && e.button !== 0) return;
        if (e.target.closest("button") && !e.target.closest(".drag-handle")) return;
        const clientX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
        const clientY = e.type.includes("mouse") ? e.clientY : e.touches[0].clientY;
        const rect = widgetRef.current.getBoundingClientRect();
        const initialRight  = window.innerWidth  - rect.right;
        const initialBottom = window.innerHeight - rect.bottom;
        dragRef.current = { startX:clientX, startY:clientY, initialRight, initialBottom, isDragMove:false };
        if (!pos) setPos({ right:initialRight, bottom:initialBottom });
        setIsDragging(true);
      };

      useEffect(() => {
        const handleDragMove = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          const clientX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
          const clientY = e.type.includes("mouse") ? e.clientY : e.touches[0].clientY;
          const dx = clientX - dragRef.current.startX;
          const dy = clientY - dragRef.current.startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragRef.current.isDragMove = true;
          const rect      = widgetRef.current.getBoundingClientRect();
          const maxRight  = window.innerWidth  - rect.width;
          const maxBottom = window.innerHeight - rect.height;
          setPos({
            right:  Math.max(0, Math.min(dragRef.current.initialRight  - dx, maxRight)),
            bottom: Math.max(0, Math.min(dragRef.current.initialBottom - dy, maxBottom))
          });
        };
        const handleDragEnd = () => setIsDragging(false);
        if (isDragging) {
          window.addEventListener("mousemove",  handleDragMove, { passive:false });
          window.addEventListener("mouseup",    handleDragEnd);
          window.addEventListener("touchmove",  handleDragMove, { passive:false });
          window.addEventListener("touchend",   handleDragEnd);
        }
        return () => {
          window.removeEventListener("mousemove",  handleDragMove);
          window.removeEventListener("mouseup",    handleDragEnd);
          window.removeEventListener("touchmove",  handleDragMove);
          window.removeEventListener("touchend",   handleDragEnd);
        };
      }, [isDragging]);

      const toggleOpen = (e) => {
        if (dragRef.current?.isDragMove) { e.preventDefault(); e.stopPropagation(); return; }
        if (!isOpen && !showMenu) {
          setShowMenu(true);
        } else {
          setIsOpen(false);
          setShowMenu(false);
        }
      };

      useEffect(() => {
        if (isOpen || showMenu) {
          const adjustPos = () => {
            const vHeight  = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const vWidth   = window.visualViewport ? window.visualViewport.width  : window.innerWidth;
            const margin   = 16;
            const isMobile = vWidth < 640;
            const chatWidth  = isMobile ? vWidth - 48 : 380;
            const chatHeight = Math.min(550, vHeight * 0.85);
            setPos(currentPos => {
              let r = currentPos ? currentPos.right  : 24;
              let b = currentPos ? currentPos.bottom : 112;
              const maxRight  = Math.max(margin, vWidth  - chatWidth  - margin);
              const maxBottom = Math.max(margin, vHeight - chatHeight - margin);
              if (r > maxRight)  r = maxRight;
              if (b > maxBottom) b = maxBottom;
              if (r < margin) r = margin;
              if (b < margin) b = margin;
              if (isMobile) r = (vWidth - chatWidth) / 2;
              if (!currentPos || r !== currentPos.right || b !== currentPos.bottom) return { right:r, bottom:b };
              return currentPos;
            });
          };
          setTimeout(adjustPos, 50);
          window.addEventListener("resize", adjustPos);
          if (window.visualViewport) window.visualViewport.addEventListener("resize", adjustPos);
          return () => {
            window.removeEventListener("resize", adjustPos);
            if (window.visualViewport) window.visualViewport.removeEventListener("resize", adjustPos);
          };
        }
      }, [isOpen, showMenu]);

      const getEliteUser = () => {
        try {
          const params = new URLSearchParams(window.location.search);
          const pName  = params.get("nombre") || params.get("name");
          const pId    = params.get("id")     || params.get("email");
          if (pName) return { name:pName, id:pId };
          const userStr = localStorage.getItem("freework_user");
          if (userStr) { const u = JSON.parse(userStr); return { name:u.name||u.nombre, id:u.id||u.email }; }
          const fallback = localStorage.getItem("freework_user_name");
          if (fallback) return { name:fallback, id:localStorage.getItem("freework_user_id") };
        } catch(e) {}
        return null;
      };

      const [clientName,   setClientName]   = useState(() => getEliteUser()?.name || "");
      const [isRegistered, setIsRegistered] = useState(() => !!getEliteUser()?.name);
      const [hasUnread,    setHasUnread]    = useState(false);
      const messagesEndRef = useRef(null);
      const prevMsgCount   = useRef(0);

      useEffect(() => {
        const interval = setInterval(() => {
          if (!isRegistered) {
            const user = getEliteUser();
            if (user?.name) { setClientName(user.name); setIsRegistered(true); }
          }
        }, 1000);
        return () => clearInterval(interval);
      }, [isRegistered]);

      const [clientId] = useState(() => {
        const user = getEliteUser();
        let id = user?.id || localStorage.getItem("chat_client_id");
        if (!id) {
          id = "cliente_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
          localStorage.setItem("chat_client_id", id);
        }
        return id;
      });

      const myMessages = useMemo(() =>
        allMessages
          .filter(m => m.conversationId === clientId)
          .sort((a,b) => Number(a.timestamp) - Number(b.timestamp)),
        [allMessages, clientId]
      );

      useEffect(() => {
        if (myMessages.length > prevMsgCount.current) {
          const last = myMessages[myMessages.length - 1];
          if (last.sender !== "client" && !isOpen && !showMenu) setHasUnread(true);
        }
        prevMsgCount.current = myMessages.length;
      }, [myMessages, isOpen, showMenu]);

      useEffect(() => { if (isOpen || showMenu) setHasUnread(false); }, [isOpen, showMenu]);
      useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:"smooth" }); }, [myMessages, isOpen]);

      const handleRegister = () => {
        if (!clientName.trim()) return;
        setIsRegistered(true);
        const onboard = cannedResponses?.find(r => r.title?.toUpperCase().trim() === "ONBOARDING");
        if (onboard) {
          setTimeout(() => {
            api.post("sendMessage", {
              chatId:     clientId,
              senderRole: "admin",
              senderName: "SISTEMA",
              text:       onboard.text.replace(/\{nombre\}/gi, clientName)
            });
          }, 1200);
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!newMessage.trim() || !clientName) return;
        const text = newMessage.trim();
        setNewMessage(""); setShowEmojis(false);
        await api.post("sendMessage", {
          chatId:     clientId,
          senderRole: "client",
          senderName: clientName,
          text
        });
        const textLower = text.toLowerCase();
        const matched = cannedResponses?.find(r => {
          if (!r.title || r.title.toUpperCase().trim() === "ONBOARDING") return false;
          const keywords = r.title.split(",").map(k => k.trim().toLowerCase()).filter(Boolean);
          return keywords.some(k => k.length > 2 && textLower.includes(k));
        });
        if (matched) {
          setTimeout(() => {
            api.post("sendMessage", {
              chatId:     clientId,
              senderRole: "admin",
              senderName: "SISTEMA",
              text:       matched.text.replace(/\{nombre\}/gi, clientName)
            });
          }, 1500);
        }
      };

      const addEmoji = (emoji) => setNewMessage(prev => prev + emoji);

      /* ── Factibilidad helpers ────────────────────────────── */
      const addLogFact = (texto, tipo = "info") => {
        const cleanText = texto.replace(/\[.*?\]:?\s?/, "").replace(/^[✅⚠️❌]\s?/, "");
        setFactLogs(prev => [...prev, { text: cleanText, type: tipo }]);
      };

      const limpiarPantallaFact = () => {
        setCampoCalle(""); setCampoNumero(""); setCampoComuna("");
        setCampoRegion(""); setCampoDepto(""); setCampoErrors({});
        setRutInput("");
        setFactLogs([]); setFactResult(null);
      };

      const cambiarModoFact = (modo) => { setFactMode(modo); limpiarPantallaFact(); };

      const obtenerUserIdFact = (callback) => {
        const userId = localStorage.getItem("freework_user_id");
        if (userId) { callback(userId); }
        else { pendingActionRef.current = callback; setShowCustomPrompt(true); }
      };

      const guardarCustomId = () => {
        const val = customPromptInput.trim();
        if (!val) return;
        localStorage.setItem("freework_user_id", val);
        setShowCustomPrompt(false); setCustomPromptInput("");
        if (pendingActionRef.current) { pendingActionRef.current(val); pendingActionRef.current = null; }
      };

      const verificarPermisoWeb = async (userId) => {
        const res = await fetch(`${SERVER_BASE}/permisos/${userId}?accion=consultar`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      };

      const finalizarLoadingDireccion = () => { setSearchBtnDisabled(false); setIsLoadingFact(false); };
      const finalizarLoadingRut       = () => { setRutBtnDisabled(false);    setIsLoadingFact(false); };

      const guardarNuevoId = () => {
        if (!nuevoIdTemp.trim()) return;
        localStorage.setItem("freework_user_id", nuevoIdTemp.trim());
        setCurrentUserId(nuevoIdTemp.trim());
        setEditandoId(false);
        setNuevoIdTemp("");
        limpiarPantallaFact();
      };

      const eliminarId = () => {
        if (confirm("¿Eliminar ID actual?")) {
          localStorage.removeItem("freework_user_id");
          setCurrentUserId("No definido");
          limpiarPantallaFact();
        }
      };

      /* ── Validación de campos de dirección ───────────────── */
      const validarCamposDireccion = () => {
        const errors = {};
        if (!campoCalle.trim())  errors.calle  = "La calle es requerida";
        if (!campoNumero.trim()) errors.numero = "El número es requerido";
        if (!campoComuna.trim()) errors.comuna = "La comuna es requerida";
        setCampoErrors(errors);
        return Object.keys(errors).length === 0;
      };

      /* ── Factibilidad: consulta dirección (SSE) ──────────── */
      const iniciarConsultaDireccion = () => {
        if (!validarCamposDireccion()) return;

        // Construir string de dirección para el backend (mismo formato que antes)
        const partes = [campoCalle.trim(), campoNumero.trim()];
        if (campoDepto.trim()) partes.push(`Depto ${campoDepto.trim()}`);
        partes.push(campoComuna.trim());
        if (campoRegion) {
          const reg = REGIONES_CHILE.find(r => r.value === campoRegion);
          if (reg && reg.value) partes.push(reg.label);
        }
        const dir = partes.join(", ");

        obtenerUserIdFact((userId) => {
          setSearchBtnDisabled(true); setIsLoadingFact(true);
          setFactLogs([]); setFactResult(null);
          addLogFact("Verificando permisos...");
          verificarPermisoWeb(userId)
            .then(permiso => {
              if (!permiso.permitido) {
                addLogFact(`Sin permiso: ${permiso.mensaje}`, "err");
                if (permiso.estadisticas) {
                  const s = permiso.estadisticas;
                  setFactResult({ type:"error", title:"Sin acceso", body:`Cupo diario: ${s.dia.usadas}/${s.dia.maximo} usadas\nRestantes hoy: ${s.dia.restantes}\nRestantes esta semana: ${s.semana.restantes}` });
                }
                finalizarLoadingDireccion(); return;
              }
              if (permiso.estadisticas) {
                const s = permiso.estadisticas;
                const usado  = Number(s.dia.usadas)  || 0;
                const maximo = Math.max(1, Number(s.dia.maximo) || 0);
                const pct    = Math.min(100, Math.round((usado / maximo) * 100));
                addLogFact(`Cupo hoy: ${s.dia.restantes} restantes (${usado}/${maximo} · ${pct}%)`, "ok");
              }
              continuarConsultaDireccion(dir, userId);
            })
            .catch(err => { addLogFact(`Error al verificar permisos: ${err.message}`, "err"); finalizarLoadingDireccion(); });
        });
      };

      const continuarConsultaDireccion = (direccion, userId) => {
        addLogFact(`Iniciando búsqueda para: ${direccion}`);
        const url = `${SERVER_BASE}/verificar?direccion=${encodeURIComponent(direccion)}&userId=${encodeURIComponent(userId)}`;
        fetch(`${SERVER_BASE}/health`, { signal: AbortSignal.timeout(3000) })
          .then(() => {
            const evtSource = new EventSource(url);
            let mensajesAcumulados = [];
            evtSource.onmessage = (e) => {
              const payload = JSON.parse(e.data);
              if (payload.tipo === "mensaje") {
                mensajesAcumulados.push(payload.texto);
                let tipo = "info";
                if (payload.texto.includes("✅")) tipo = "ok";
                if (payload.texto.includes("⚠️")) tipo = "warn";
                if (payload.texto.includes("❌")) tipo = "err";
                addLogFact(payload.texto, tipo);
              }
              if (payload.tipo === "foto" && payload.base64) {
                setFactResult(prev => ({ ...(prev||{}), type:"success", title:"Factibilidad Confirmada", body:"Se ha capturado la evidencia de cobertura.", img:payload.base64 }));
              }
              if (payload.tipo === "fin") {
                const finalMsg  = mensajesAcumulados.join("\n");
                const tipoFinal = finalMsg.includes("✅") ? "success" : (finalMsg.includes("⚠️") ? "warning" : "error");
                setFactResult(prev => {
                  if (prev && prev.img) return { ...prev, type:tipoFinal, body:finalMsg };
                  return { type:tipoFinal, title:tipoFinal==="success"?"Disponible":tipoFinal==="warning"?"Observación":"No Disponible", body:finalMsg };
                });
                evtSource.close(); finalizarLoadingDireccion();
              }
              if (payload.tipo === "error") {
                addLogFact(payload.texto, "err");
                setFactResult({ type:"error", title:"Error del Sistema", body:payload.texto });
                evtSource.close(); finalizarLoadingDireccion();
              }
            };
            evtSource.onerror = () => { evtSource.close(); finalizarLoadingDireccion(); };
          })
          .catch(() => {
            addLogFact("No se pudo establecer conexión con el bot.", "err");
            setFactResult({ type:"error", title:"Error de Conexión", body:"Asegúrate de que el servidor esté activo." });
            finalizarLoadingDireccion();
          });
      };

      /* ── Factibilidad: consulta RUT (POST) ───────────────── */
      const consultarRut = () => {
        const rut = rutInput.trim();
        if (!rut) return;
        obtenerUserIdFact((userId) => {
          setRutBtnDisabled(true); setIsLoadingFact(true);
          setFactLogs([]); setFactResult(null);
          addLogFact("Verificando permisos...");
          verificarPermisoWeb(userId)
            .then(permiso => {
              if (!permiso.permitido) {
                addLogFact(`Sin permiso: ${permiso.mensaje}`, "err");
                if (permiso.estadisticas) {
                  const s = permiso.estadisticas;
                  setFactResult({ type:"error", title:"Sin acceso", body:`Cupo diario: ${s.dia.usadas}/${s.dia.maximo} usadas\nRestantes hoy: ${s.dia.restantes}\nRestantes esta semana: ${s.semana.restantes}` });
                }
                finalizarLoadingRut(); return;
              }
              if (permiso.estadisticas) {
                const s = permiso.estadisticas;
                const usado  = Number(s.dia.usadas)  || 0;
                const maximo = Math.max(1, Number(s.dia.maximo) || 0);
                const pct    = Math.min(100, Math.round((usado / maximo) * 100));
                addLogFact(`Cupo hoy: ${s.dia.restantes} restantes (${usado}/${maximo} · ${pct}%)`, "ok");
              }
              addLogFact(`Evaluando RUT: ${rut}...`);
              fetch(`${SERVER_BASE}/rut`, {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ rut, userId })
              })
              .then(res => res.json())
              .then(data => {
                if (data.ocr) {
                  addLogFact("OCR: " + (data.ocr.tieneAprobado ? "APROBADO" : "NO DETECTADO"), "info");
                  if (data.ocr.cupoDetectado) addLogFact("OCR Cupo: " + data.ocr.cupoDetectado, "ok");
                }
                let screenshot = data.screenshot_recortado || data.screenshot || null;
                if (screenshot && screenshot.startsWith("data:image")) screenshot = screenshot.split(",")[1];
                if (data.ok) {
                  const mensaje    = data.mensaje || "Evaluación completada";
                  const esAprobado = data.resultado === "aprobado" || mensaje.includes("✅");
                  addLogFact(mensaje, esAprobado ? "ok" : "warn");
                  setFactResult({ type:esAprobado?"success":"warning", title:esAprobado?"RUT Aprobado":"RUT con Observaciones", body:mensaje, img:screenshot });
                } else {
                  addLogFact(data.error || "Error al evaluar RUT", "err");
                  setFactResult({ type:"error", title:"Error", body:data.error || "No se pudo evaluar el RUT" });
                }
                finalizarLoadingRut();
              })
              .catch(() => {
                addLogFact("Error de conexión con el servidor", "err");
                setFactResult({ type:"error", title:"Error de Conexión", body:"El servidor no respondió a la solicitud." });
                finalizarLoadingRut();
              });
            })
            .catch(err => { addLogFact(`Error al verificar permisos: ${err.message}`, "err"); finalizarLoadingRut(); });
        });
      };

      /* ── RENDER ──────────────────────────────────────────── */
      const widgetStyle = pos
        ? { right: pos.right, bottom: pos.bottom, transition: isDragging ? "none" : "bottom 0.2s, right 0.2s" }
        : { right: 24, bottom: 112 };

      return (
        <div id="fw-root" className={isDragging ? "dragging-active" : ""} style={{ position:"fixed", inset:0, width:"100%", height:"100%", pointerEvents:"none", zIndex:9999 }}>

          {/* ── WIDGET FLOTANTE ─────────────────────────────── */}
          <div
            ref={widgetRef}
            style={{ ...widgetStyle, position:"absolute", zIndex:50, display:"flex", flexDirection:"column", alignItems:"flex-end", pointerEvents:"auto" }}
          >
            {/* Botón flotante */}
            {!isOpen && !showMenu && (
              <button
                className="drag-handle btn-premium chat-float-btn"
                onMouseDown={handleDragStart}
                onTouchStart={handleDragStart}
                onClick={toggleOpen}
                style={{ WebkitTapHighlightColor:"transparent" }}
              >
                {hasUnread && (
                  <span className="unread-badge">
                    <i className="fa-solid fa-bell" style={{ fontSize:9 }}></i>
                  </span>
                )}
                <div style={{ width:48, height:48, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, position:"relative", zIndex:10, pointerEvents:"none" }}>
                  <i className="fa-solid fa-location-dot" style={{ fontSize:20 }}></i>
                </div>
              </button>
            )}

            {/* Menú de selección */}
            {showMenu && !isOpen && (
              <div className="chat-menu animate-slide-up">
                <div
                  className="drag-handle drag-header"
                  onMouseDown={handleDragStart}
                  onTouchStart={handleDragStart}
                >
                  <div style={{ display:"flex", alignItems:"center", gap:12, pointerEvents:"none" }}>
                    <div style={{ width:32, height:32, background:"rgba(255,255,255,0.1)", borderRadius:12, display:"flex", alignItems:"center", justifyContent:"center", color:"white" }}>
                      <i className="fa-solid fa-bars" style={{ fontSize:14 }}></i>
                    </div>
                    <h3 style={{ fontWeight:900, color:"white", fontSize:14, textTransform:"uppercase", letterSpacing:"-0.5px", fontStyle:"italic" }}>Selecciona una opción</h3>
                  </div>
                  <button className="drag-header-btn" onClick={toggleOpen}>
                    <i className="fa-solid fa-xmark" style={{ fontSize:20, pointerEvents:"none" }}></i>
                  </button>
                </div>
                <div style={{ padding:24, display:"flex", flexDirection:"column", gap:16 }}>
                  <button
                    className="menu-option"
                    onClick={(e) => { e.preventDefault(); setShowMenu(false); setIsOpen(true); }}
                    style={{ borderColor:"#f1f5f9" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor="rgba(178,51,255,0.5)"; e.currentTarget.style.boxShadow="0 10px 20px -5px rgba(178,51,255,0.2)"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor="#f1f5f9"; e.currentTarget.style.boxShadow="none"; }}
                  >
                    <div className="absolute inset-0" style={{ background:"linear-gradient(to right,rgba(178,51,255,0.05),transparent)", opacity:0, transition:"opacity 0.3s" }}></div>
                    <div className="menu-option-icon" style={{ background:"#eff6ff", color:"#3b82f6" }}>
                      <i className="fa-solid fa-headset" style={{ fontSize:20 }}></i>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-start", textAlign:"left", position:"relative", zIndex:10 }}>
                      <span style={{ fontWeight:900, color:"#1e293b", textTransform:"uppercase", letterSpacing:"-0.5px" }}>Soporte</span>
                      <span style={{ fontSize:11, color:"#64748b", fontWeight:500 }}>Ayuda con tu servicio actual</span>
                    </div>
                    <i className="fa-solid fa-chevron-right menu-option-chevron"></i>
                  </button>
                  <button
                    className="menu-option"
                    onClick={(e) => { e.preventDefault(); setShowMenu(false); setShowFactibilidadModal(true); }}
                    style={{ borderColor:"#f1f5f9" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor="rgba(255,77,248,0.5)"; e.currentTarget.style.boxShadow="0 10px 20px -5px rgba(255,77,248,0.2)"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor="#f1f5f9"; e.currentTarget.style.boxShadow="none"; }}
                  >
                    <div className="absolute inset-0" style={{ background:"linear-gradient(to right,rgba(255,77,248,0.05),transparent)", opacity:0, transition:"opacity 0.3s" }}></div>
                    <div className="menu-option-icon" style={{ background:"#fdf4ff", color:"#ff4df8" }}>
                      <i className="fa-solid fa-location-dot" style={{ fontSize:20 }}></i>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-start", textAlign:"left", position:"relative", zIndex:10 }}>
                      <span style={{ fontWeight:900, color:"#1e293b", textTransform:"uppercase", letterSpacing:"-0.5px" }}>Factibilidad</span>
                      <span style={{ fontSize:11, color:"#64748b", fontWeight:500 }}>Consulta de nueva cobertura</span>
                    </div>
                    <i className="fa-solid fa-chevron-right menu-option-chevron"></i>
                  </button>
                </div>
              </div>
            )}

            {/* Ventana del chat */}
            {isOpen && (
              <div className="chat-window animate-slide-up">
                <div
                  className="drag-handle drag-header"
                  onMouseDown={handleDragStart}
                  onTouchStart={handleDragStart}
                >
                  <div style={{ display:"flex", alignItems:"center", gap:16, pointerEvents:"none" }}>
                    <div style={{ width:40, height:40, background:"linear-gradient(135deg,#b233ff,#ff4df8)", borderRadius:16, display:"flex", alignItems:"center", justifyContent:"center", color:"white", boxShadow:"0 10px 15px -3px rgba(168,85,247,0.3)" }}>
                      <i className="fa-solid fa-location-dot" style={{ fontSize:18 }}></i>
                    </div>
                    <div>
                      <h3 style={{ fontWeight:900, color:"white", fontSize:16, textTransform:"uppercase", letterSpacing:"-0.5px", fontStyle:"italic" }}>Terminal BOT</h3>
                      <p style={{ color:"#cbd5e1", fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.15em", marginTop:2, opacity:0.8 }}>Sistema de Soporte</p>
                    </div>
                  </div>
                  <button className="drag-header-btn" onClick={toggleOpen}>
                    <i className="fa-solid fa-xmark" style={{ fontSize:20, pointerEvents:"none" }}></i>
                  </button>
                </div>

                {!isRegistered ? (
                  <div className="register-screen">
                    <div style={{ width:80, height:80, background:"rgba(255,255,255,0.8)", border:"1px solid white", boxShadow:"0 15px 35px -5px rgba(178,51,255,0.15)", color:"#b233ff", borderRadius:40, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:24, flexShrink:0 }}>
                      <i className="fa-solid fa-fingerprint" style={{ fontSize:40, opacity:0.8 }}></i>
                    </div>
                    <h4 style={{ fontSize:22, fontWeight:900, color:"#1e293b", marginBottom:8, textTransform:"uppercase", letterSpacing:"-0.5px" }}>Acceso Requerido</h4>
                    <p style={{ fontSize:12, color:"#64748b", marginBottom:24, fontWeight:500, lineHeight:1.6, paddingLeft:16, paddingRight:16 }}>Identifícate para iniciar la atención de soporte.</p>
                    <input
                      type="text"
                      placeholder="Tu nombre completo"
                      value={clientName}
                      onChange={e => setClientName(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter") handleRegister(); }}
                    />
                    <button className="register-btn" onClick={handleRegister}>Inicializar Sesión</button>
                  </div>
                ) : (
                  <>
                    <div className="chat-messages">
                      <div style={{ position:"absolute", inset:0, background:"linear-gradient(to bottom,rgba(233,213,255,0.2),transparent)", pointerEvents:"none" }}></div>
                      <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-start", position:"relative", zIndex:10 }}>
                        <div className="msg-bot">
                          <p style={{ fontWeight:900, fontSize:10, background:"linear-gradient(to right,#b233ff,#ff4df8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", backgroundClip:"text", textTransform:"uppercase", letterSpacing:"0.2em", borderBottom:"1px solid #f1f5f9", paddingBottom:8, marginBottom:12 }}>CONEXIÓN ESTABLECIDA</p>
                          <p style={{ fontWeight:700, color:"#0f172a", marginBottom:4 }}>HOLA, {clientName.toUpperCase()}</p>
                          <p style={{ color:"#64748b", lineHeight:1.6 }}>¿En qué podemos ayudarte el día de hoy?</p>
                        </div>
                      </div>
                      {myMessages.map(msg => {
                        const isMe     = msg.sender === "client";
                        const isSystem = msg.senderName === "SISTEMA" || msg.senderName === "Bot Automático";
                        if (isSystem) return (
                          <div key={msg.id} className="msg-wrap-bot">
                            <div className="msg-robot-icon">
                              <i className="fa-solid fa-robot" style={{ color:"#10b981", fontSize:12 }}></i>
                            </div>
                            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-start" }}>
                              <div className="msg-bot">{msg.text}</div>
                            </div>
                          </div>
                        );
                        return (
                          <div key={msg.id} style={{ display:"flex", flexDirection:"column", maxWidth:"85%", position:"relative", zIndex:10, alignSelf:isMe?"flex-end":"flex-start", alignItems:isMe?"flex-end":"flex-start" }}>
                            <div className={isMe ? "msg-user" : "msg-bot"}>{msg.text}</div>
                          </div>
                        );
                      })}
                      <div ref={messagesEndRef} style={{ height:8 }}></div>
                    </div>

                    <form onSubmit={handleSendMessage} className="chat-input-area" style={{ display:"flex" }}>
                      <div className="chat-input-wrap" style={{ position:"relative" }}>
                        <button
                          type="button"
                          className={"emoji-toggle" + (showEmojis ? " active" : "")}
                          onClick={() => setShowEmojis(!showEmojis)}
                        >
                          <i className="fa-regular fa-face-smile" style={{ fontSize:18 }}></i>
                        </button>
                        <input
                          type="text"
                          value={newMessage}
                          onChange={e => setNewMessage(e.target.value)}
                          placeholder="Escribe tu mensaje..."
                        />
                        {showEmojis && (
                          <div className="emoji-panel animate-slide-up">
                            {emojis.map(emoji => (
                              <button key={emoji} type="button" className="emoji-btn" onClick={() => addEmoji(emoji)}>{emoji}</button>
                            ))}
                          </div>
                        )}
                      </div>
                      <button type="submit" disabled={!newMessage.trim()} className="send-btn">
                        <i className="fa-solid fa-paper-plane" style={{ fontSize:14, transform:"translateX(-1px) translateY(1px)" }}></i>
                      </button>
                    </form>
                  </>
                )}
              </div>
            )}
          </div>

          {/* ── MODAL DE FACTIBILIDAD ───────────────────────── */}
          <div
            id="fw-modal-overlay"
            className={showFactibilidadModal ? "active" : ""}
            onClick={(e) => { if (e.target.id === "fw-modal-overlay") setShowFactibilidadModal(false); }}
          >
            <button id="fw-close-btn" title="Cerrar" onClick={() => setShowFactibilidadModal(false)}>
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
              </svg>
            </button>

            <div className="fw-app-container">
              <header>
                <div className="fw-logo">Free<em>work</em>Bot</div>
                <div className="fw-badge"><span className="fw-badge-dot"></span>Conectado</div>
              </header>

              {/* Panel ID */}
              <div style={{ background:"rgba(255,255,255,0.03)", borderRadius:"12px", padding:"10px 12px", marginBottom:"20px", border:"1px solid var(--border)" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:"8px" }}>
                  <div style={{ fontSize:"11px", color:"var(--text-2)" }}>
                    <i className="fa-regular fa-id-card"></i> ID: <strong style={{ color: currentUserId !== "No definido" ? "#00f298" : "#ffb800" }}>{currentUserId}</strong>
                  </div>
                  <div style={{ display:"flex", gap:"6px" }}>
                    {!editandoId ? (
                      <>
                        <button onClick={() => { setNuevoIdTemp(currentUserId !== "No definido" ? currentUserId : ""); setEditandoId(true); }} style={{ background:"none", border:"1px solid var(--border)", borderRadius:"8px", padding:"4px 8px", color:"var(--text-2)", fontSize:"10px", cursor:"pointer" }}>✏️ Cambiar</button>
                        {currentUserId !== "No definido" && (
                          <button onClick={eliminarId} style={{ background:"none", border:"1px solid rgba(255,75,129,0.3)", borderRadius:"8px", padding:"4px 8px", color:"#ff4b81", fontSize:"10px", cursor:"pointer" }}>🗑️ Eliminar</button>
                        )}
                      </>
                    ) : (
                      <>
                        <input type="text" value={nuevoIdTemp} onChange={e => setNuevoIdTemp(e.target.value)} onKeyDown={e => e.key === "Enter" && guardarNuevoId()} placeholder="Nuevo ID" autoFocus style={{ background:"rgba(255,255,255,0.1)", border:"1px solid var(--primary)", borderRadius:"8px", padding:"4px 8px", color:"white", fontSize:"10px", width:"120px", outline:"none" }} />
                        <button onClick={guardarNuevoId} style={{ background:"linear-gradient(135deg,#b233ff,#ff4df8)", border:"none", borderRadius:"8px", padding:"4px 8px", color:"white", fontSize:"10px", cursor:"pointer" }}>✓</button>
                        <button onClick={() => { setEditandoId(false); setNuevoIdTemp(""); }} style={{ background:"none", border:"1px solid var(--border)", borderRadius:"8px", padding:"4px 8px", color:"var(--text-2)", fontSize:"10px", cursor:"pointer" }}>✕</button>
                      </>
                    )}
                  </div>
                </div>
              </div>

              <h1>Validación</h1>
              <p className="fw-subtitle">Consulta factibilidad técnica o evaluación de RUT de forma automatizada.</p>

              {/* Tabs */}
              <div className="fw-tabs-container">
                <button className={"fw-tab-btn" + (factMode === "direccion" ? " active" : "")} onClick={() => cambiarModoFact("direccion")}>📍 Dirección</button>
                <button className={"fw-tab-btn" + (factMode === "rut"       ? " active" : "")} onClick={() => cambiarModoFact("rut")}>🪪 RUT</button>
              </div>

              {/* ══ PANEL DIRECCIÓN — CAMPOS SEPARADOS ══ */}
              {factMode === "direccion" && (
                <div className="fw-fields-grid animate-slide-up">

                  {/* Fila 1: Calle + Número */}
                  <div className="fw-fields-row">
                    {/* Calle */}
                    <div className="fw-field-group" style={{ flex: 2 }}>
                      <label className="fw-field-label">
                        Calle / Av. / Pasaje
                        <span className="fw-field-required">*</span>
                      </label>
                      <div className="fw-field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                          <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        <input
                          className={"fw-field-input" + (campoErrors.calle ? " error" : campoCalle ? " ok" : "")}
                          type="text"
                          value={campoCalle}
                          onChange={e => { setCampoCalle(e.target.value); if(campoErrors.calle) setCampoErrors(p=>({...p,calle:null})); }}
                          onKeyDown={e => e.key === "Enter" && iniciarConsultaDireccion()}
                          placeholder="Av. Providencia"
                          autoComplete="off"
                          spellCheck="false"
                        />
                      </div>
                      {campoErrors.calle && <span className="fw-field-error-msg">⚠ {campoErrors.calle}</span>}
                    </div>

                    {/* Número */}
                    <div className="fw-field-group" style={{ flex: 1 }}>
                      <label className="fw-field-label">
                        Número
                        <span className="fw-field-required">*</span>
                      </label>
                      <div className="fw-field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M9 7h1l2 10h1"/><path d="M4 17h16"/>
                          <circle cx="9" cy="7" r="0.5" fill="currentColor"/>
                        </svg>
                        <input
                          className={"fw-field-input" + (campoErrors.numero ? " error" : campoNumero ? " ok" : "")}
                          type="text"
                          value={campoNumero}
                          onChange={e => { setCampoNumero(e.target.value); if(campoErrors.numero) setCampoErrors(p=>({...p,numero:null})); }}
                          onKeyDown={e => e.key === "Enter" && iniciarConsultaDireccion()}
                          placeholder="1234"
                          autoComplete="off"
                        />
                      </div>
                      {campoErrors.numero && <span className="fw-field-error-msg">⚠ {campoErrors.numero}</span>}
                    </div>
                  </div>

                  {/* Fila 2: Depto (opcional) */}
                  <div className="fw-field-group">
                    <label className="fw-field-label">
                      Depto / Oficina / Casa
                      <span style={{ color:"var(--text-3)", marginLeft:4, fontWeight:400 }}>(opcional)</span>
                    </label>
                    <div className="fw-field-wrap">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                      </svg>
                      <input
                        className={"fw-field-input" + (campoDepto ? " ok" : "")}
                        type="text"
                        value={campoDepto}
                        onChange={e => setCampoDepto(e.target.value)}
                        onKeyDown={e => e.key === "Enter" && iniciarConsultaDireccion()}
                        placeholder="302, Of. 5, Casa B..."
                        autoComplete="off"
                      />
                    </div>
                  </div>

                  {/* Fila 3: Región + Comuna */}
                  <div className="fw-fields-row">
                    {/* Región */}
                    <div className="fw-field-group" style={{ flex: 1 }}>
                      <label className="fw-field-label">Región</label>
                      <div className="fw-field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <circle cx="12" cy="12" r="10"/>
                          <line x1="2" y1="12" x2="22" y2="12"/>
                          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                        <select
                          className="fw-field-select"
                          value={campoRegion}
                          onChange={e => setCampoRegion(e.target.value)}
                        >
                          {REGIONES_CHILE.map(r => (
                            <option key={r.value} value={r.value}>{r.label}</option>
                          ))}
                        </select>
                        <svg className="fw-select-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <polyline points="6 9 12 15 18 9"/>
                        </svg>
                      </div>
                    </div>

                    {/* Comuna */}
                    <div className="fw-field-group" style={{ flex: 1 }}>
                      <label className="fw-field-label">
                        Comuna
                        <span className="fw-field-required">*</span>
                      </label>
                      <div className="fw-field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                          <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <input
                          className={"fw-field-input" + (campoErrors.comuna ? " error" : campoComuna ? " ok" : "")}
                          type="text"
                          value={campoComuna}
                          onChange={e => { setCampoComuna(e.target.value); if(campoErrors.comuna) setCampoErrors(p=>({...p,comuna:null})); }}
                          onKeyDown={e => e.key === "Enter" && iniciarConsultaDireccion()}
                          placeholder="Providencia"
                          autoComplete="off"
                        />
                      </div>
                      {campoErrors.comuna && <span className="fw-field-error-msg">⚠ {campoErrors.comuna}</span>}
                    </div>
                  </div>

                  {/* Preview de dirección armada */}
                  {dirPreview && (
                    <div className="fw-dir-preview animate-slide-up">
                      <span className="preview-label">📋 Consulta:</span>
                      <span className="preview-value">{dirPreview}</span>
                    </div>
                  )}

                  {/* Botón verificar */}
                  <button
                    className="fw-main-btn"
                    onClick={iniciarConsultaDireccion}
                    disabled={searchBtnDisabled || isLoadingFact}
                    style={{ marginTop: 4 }}
                  >
                    {isLoadingFact && factMode === "direccion"
                      ? <><div className="fw-spinner"></div><span>Verificando...</span></>
                      : <><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Verificar Cobertura</span></>
                    }
                  </button>
                </div>
              )}

              {/* Panel RUT (sin cambios) */}
              {factMode === "rut" && (
                <div className="fw-input-row animate-slide-up">
                  <div className="fw-input-wrap">
                    <input
                      type="text"
                      value={rutInput}
                      onChange={e => setRutInput(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && consultarRut()}
                      placeholder="12.345.678-9"
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                      <circle cx="9" cy="7" r="4"/>
                    </svg>
                  </div>
                  <button className="fw-main-btn" onClick={consultarRut} disabled={rutBtnDisabled || isLoadingFact}>
                    {isLoadingFact && factMode === "rut"
                      ? <><div className="fw-spinner"></div><span>Verificando...</span></>
                      : <span>Verificar RUT</span>
                    }
                  </button>
                </div>
              )}

              {/* Nueva Consulta */}
              {(factLogs.length > 0 || factResult) && !isLoadingFact && (
                <button className="fw-clearBtn active" onClick={limpiarPantallaFact}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                  </svg>
                  Nueva Consulta
                </button>
              )}

              {/* Logs */}
              {factLogs.length > 0 && (
                <div className="fw-log-section active">
                  <div className="fw-log-label">
                    <span>Estado del proceso</span>
                    <span>{isLoadingFact ? "Analizando..." : "Finalizado"}</span>
                  </div>
                  {isLoadingFact && (
                    <div className="fw-progress-container">
                      <div className="fw-progress-bar"></div>
                    </div>
                  )}
                  <div className="fw-status-feed" ref={logStreamRef}>
                    {factLogs.map((log, i) => (
                      <div key={i} className={"fw-status-item " + (log.type || "")}>
                        <i></i><span>{log.text}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Resultado */}
              {factResult && (
                <div className="fw-result-section active animate-slide-up">
                  <div className={"fw-result-card " + (factResult.type || "")}>
                    <div className="fw-result-head">
                      <span className="fw-result-icon">
                        {factResult.type === "success" ? "✅" : factResult.type === "warning" ? "⚠️" : "❌"}
                      </span>
                      <span className="fw-result-title">{factResult.title}</span>
                    </div>
                    <div className="fw-result-body">{factResult.body}</div>
                    {factResult.img && (
                      <img
                        className="fw-result-img visible"
                        src={"data:image/png;base64," + factResult.img}
                        alt="Evidencia"
                      />
                    )}
                  </div>
                </div>
              )}

              <footer className="fw-footer">
                <span>FREEOPS © 2026</span>
                <span style={{ color:"var(--primary)", fontWeight:700 }}>ACTIVE ENGINE</span>
              </footer>
            </div>
          </div>

          {/* ── CUSTOM PROMPT MODAL ─────────────────────────── */}
          <div id="customPromptOverlay" className={showCustomPrompt ? "active" : ""} style={{ pointerEvents: showCustomPrompt ? "auto" : "none" }}>
            <div className="custom-prompt-box">
              <h3>🔐 Ingresa tu ID</h3>
              <p>Necesitamos validar tu identidad para continuar.</p>
              <input
                type="text"
                value={customPromptInput}
                onChange={e => setCustomPromptInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && guardarCustomId()}
                placeholder="Tu ID de acceso"
              />
              <button className="fw-main-btn" onClick={guardarCustomId}>Guardar y Continuar</button>
            </div>
          </div>
        </div>
      );
    }

    /* ================================================================
       COORDINADOR PRINCIPAL
    ================================================================ */
    function App() {
      const [allMessages,     setAllMessages]     = useState([]);
      const [cannedResponses, setCannedResponses] = useState([]);

      useEffect(() => {
        let isMounted = true;
        const loadData = async () => {
          const [msgsRaw, cannedRaw] = await Promise.all([
            api.get("getMessages"),
            api.get("getCannedResponses")
          ]);
          if (!isMounted) return;
          if (Array.isArray(msgsRaw)) setAllMessages(msgsRaw.map(m => ({
            id:             m["MENSAJE_ID"],
            conversationId: m["CHAT_ID"],
            sender:         m["ROL_EMISOR"],
            senderName:     m["NOMBRE_EMISOR"],
            text:           m["TEXTO"],
            timestamp:      m["TIMESTAMP"]
          })));
          if (Array.isArray(cannedRaw)) setCannedResponses(cannedRaw.map(r => ({
            id:    r["ID_RESPUESTA"],
            title: r["TITULO"],
            text:  r["TEXTO"]
          })));
        };
        loadData();
        const interval = setInterval(loadData, 4000);
        return () => { isMounted = false; clearInterval(interval); };
      }, []);

      return <ClientWebsite allMessages={allMessages} cannedResponses={cannedResponses} />;
    }

    /* ── Mount ─────────────────────────────────────────────── */
    const root = ReactDOM.createRoot(document.getElementById("fw-root"));
    root.render(<App />);
  </script>
</body>
</html>
